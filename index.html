		<script>
// Crash breadcrumbs, page half (the game half is game/scripts/perf.gd). This is the only place that reads and
// classifies the previous run's crumb; it then starts this run's before the engine loads, so a death while the
// engine downloads or compiles is reported too. Never throws: the page must load whatever happens here.
(function(){try{
var K='ashgrave_crumb',D=document,run=Math.random().toString(36).slice(2,10),t0=Date.now(),ls=null,p=null,mem=null,shared=false,cur;
function vis(){return D.visibilityState!=='hidden';}
try{ls=localStorage;p=JSON.parse(ls.getItem(K)||'null');}catch(e){}
function save(){try{ls.setItem(K,JSON.stringify(cur));}catch(e){}}
try{var P=WebAssembly.Memory.prototype,og=P.grow,d=Object.getOwnPropertyDescriptor(P,'buffer');
P.grow=function(){mem=this;return og.apply(this,arguments);};
if(d&&d.get){Object.defineProperty(P,'buffer',{configurable:true,get:function(){mem=this;return d.get.call(this);}});}}catch(e){}
function heap(){try{if(mem){return mem.buffer.byteLength;}}catch(e){}return -1;}
// Canvas resolution: at most 2 device pixels per CSS pixel. The engine sizes its canvas and full-size render
// buffers by devicePixelRatio; at 3 (iPhones) that is 2.25x the pixels of 2 for no visible gain (the 3D view is
// scaled to about 640 rows either way). __ag.dpr() keeps the real ratio for the crumbs.
// In safe quality the cap is lower (SAFE_DPR_CAP). It is read here, before the engine starts, from ?quality= or from the
// small key 'ashgrave_quality' that the game writes whenever the level changes, so it applies from the first frame; a change
// of level made in the game takes effect at the next launch.
var DPR_CAP=2,SAFE_DPR_CAP=1.5,dpd=null;try{var ql=new URLSearchParams(location.search).get('quality')||(ls&&ls.getItem('ashgrave_quality'))||'';if(ql==='safe'){DPR_CAP=SAFE_DPR_CAP;}}catch(e){}
try{dpd=Object.getOwnPropertyDescriptor(window,'devicePixelRatio')||Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window),'devicePixelRatio');
if(dpd&&dpd.get){Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:function(){return Math.min(dpd.get.call(window)||1,DPR_CAP);}});}}catch(e){}
function rdpr(){try{return dpd&&dpd.get?dpd.get.call(window):(window.devicePixelRatio||1);}catch(e){return 1;}}
cur={phase:'boot',live:vis(),ts:t0,run:run};if(!cur.live){cur.hid_at=t0;}save();
function hide(final){var t=Date.now();
if(cur.live&&t-cur.ts>(cur.phase==='boot'?60000:15000)){cur.stalled=true;}
else{cur.live=false;cur.hid_at=cur.hid_at||t;if(final){cur.left=true;}}
save();}
function show(){if(cur.stalled){return;}cur.live=true;cur.ts=Date.now();delete cur.hid_at;delete cur.left;save();}
function flip(){if(vis()){show();}else{hide(false);}}
addEventListener('pagehide',function(){hide(true);});
addEventListener('pageshow',flip);
D.addEventListener('visibilitychange',flip);
function other(){shared=true;cur.shared=true;save();}
try{var bc=new BroadcastChannel('ashgrave_tabs');
bc.onmessage=function(e){if(vis()){other();if(e.data==='ping'){bc.postMessage('pong');}}};bc.postMessage('ping');}catch(e){}
setInterval(function(){if(cur.phase==='boot'){cur.heap=heap();cur.ts=Date.now();save();}},4000);
window.__ag={
w:function(s){try{var o=JSON.parse(s),t=Date.now(),q=null;
try{q=JSON.parse(ls.getItem(K));}catch(e){}
if(q&&q.run!==run&&q.live===true&&t-q.ts<10000){shared=true;}
o.run=run;o.live=cur.live;o.ts=t;o.heap=heap();if(shared){o.shared=true;}
if(cur.hid_at){o.hid_at=cur.hid_at;}if(cur.left){o.left=true;}
cur=o;save();}catch(e){}},
heap:heap,dpr:rdpr,
rep:function(){if(!p||typeof p!=='object'){return '';}var k='';
if(p.live===true){k=(p.shared||shared)?'shared':p.stalled?'stalled':'died';}else if(p.hid_at&&!p.left){k='hidden';}
return k?JSON.stringify({kind:k,c:p,age:Math.round((t0-(p.ts||t0))/1000),hid:Math.round((t0-(p.hid_at||t0))/1000)}):'';},
pack:function(){try{var r=performance.getEntriesByType('resource');for(var i=0;i<r.length;i++){var m=/game_[0-9a-f]+/.exec(r[i].name);if(m){return m[0];}}}catch(e){}return '';}};
}catch(e){}})();
</script>

// The engine binary is shipped in pieces; stitch them back together on load.
(function(){
  var realFetch = window.fetch.bind(window);
  var PARTS = ["part0.wasm", "part1.wasm", "part2.wasm"];
  window.fetch = function(input, init){
    var url = (typeof input === "string") ? input : (input && input.url) || "";
    var name = url.split("?")[0].split("/").pop();
    if (name === "index.wasm") {
      return Promise.all(PARTS.map(function(p){ return realFetch(p).then(function(r){
        if(!r.ok) throw new Error("Failed to load "+p); return r.arrayBuffer(); }); }))
        .then(function(bufs){ return new Response(new Blob(bufs,{type:"application/wasm"}),
          {status:200, headers:{"Content-Type":"application/wasm"}}); });
    }
    if (name === "index.pck") return realFetch("game_0b7aba5976.wasm", {cache: "no-cache"});
    return realFetch(input, init);
  };
  // Stop the page itself from scrolling, zooming or selecting during play.
  ["gesturestart","gesturechange","contextmenu"].forEach(function(e){
    document.addEventListener(e, function(ev){ ev.preventDefault(); }, {passive:false}); });
  ["touchstart","touchmove","touchend"].forEach(function(e){
    document.addEventListener(e, function(ev){ if (ev.cancelable) ev.preventDefault(); }, {passive:false}); });
  window.addEventListener("scroll", function(){ window.scrollTo(0,0); });
})();
</script>

@media (orientation:portrait){#rotate{display:flex}}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":810526,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
